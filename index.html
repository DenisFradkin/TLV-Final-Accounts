<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>

<style>
/*
VOICE: municipal engineering office – calm, exact, confident.
IDEA: a cost-control desk: a deep sea-blue rail, white ledgers, mint for "approved", amber for "needs a look".
PICTURE: dashboard hero with an original skyline of public buildings; the working sheet itself on the project pages.
COLOUR/TYPE: sea blue #0B3954 + teal #0A7E8C, mint #B8F5D0 for done, amber for review, red for missing. Rubik headings, Assistant text.
LAYOUT: right sidebar navigation, content cards, stepper for the three steps.
*/
:root{color-scheme:light;--bg:#F3F6F8;--card:#FFFFFF;--ink:#122230;--mute:#5E6E7B;--line:#E1E7EC;--soft:#F5F8FA;
--brand:#0B3954;--brand2:#0A7E8C;--brandSoft:#E6F2F4;--mint:#D3F7E2;--mintInk:#0B5A33;--warn:#FFF3D1;--warnInk:#7A5300;--bad:#FFE0DC;--badInk:#93261A;--acc:#0B3954;
--sh:0 1px 2px rgba(16,40,60,.06),0 6px 22px rgba(16,40,60,.06)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Assistant,Arial,sans-serif}
h1,h2,h3{font-family:Rubik,Assistant,sans-serif;margin:0;line-height:1.15;color:var(--ink)}
h1{font-size:30px}h2{font-size:26px}h3{font-size:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 16px;min-height:40px;transition:border-color .15s,background .15s}
button:hover{border-color:var(--brand2)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand2);outline-offset:1px}
button.pri{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
button.pri:hover{background:#0d4a6c}
button.ghost{border-color:transparent;background:transparent}
button.sm{min-height:32px;padding:4px 12px;font-size:14px;border-radius:8px}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;font-size:16px;width:100%}
textarea{min-height:64px;resize:vertical}
.small{font-size:14px}.muted{color:var(--mute)}
/* shell */
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(180deg,#0B3954 0%,#08283C 100%);color:#DCE9F0;padding:22px 16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:12px;align-items:center;padding:4px 6px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand .logo{width:52px;height:52px;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.brand .logo img{max-width:46px;max-height:46px}
.brand .logo svg{width:34px;height:34px}
.brand b{display:block;font-family:Rubik,sans-serif;font-size:18px;color:#fff;line-height:1.2}
.brand span{font-size:13px;color:#A9C4D3}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{background:transparent;border:0;color:#DCE9F0;text-align:start;display:flex;align-items:center;gap:12px;border-radius:10px;padding:10px 12px;font-size:16px}
.nav button svg{width:20px;height:20px;flex:none;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:#fff;color:var(--brand);font-weight:700}
.nav .new{background:var(--brand2);color:#fff;font-weight:700;margin-top:6px}
.nav .new:hover{background:#0c8f9e}
.side-foot{margin-top:auto;font-size:13px;color:#A9C4D3;display:flex;flex-direction:column;gap:6px;padding:10px 6px;border-top:1px solid rgba(255,255,255,.12)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;background:#7BE0A6}
.dot.off{background:#FFC857}
main{padding:28px clamp(16px,3vw,40px) 60px;max-width:1560px;width:100%}
/* cards */
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:22px}
.hero{position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(120deg,#0B3954 0%,#0A7E8C 100%);color:#fff;padding:30px 32px;min-height:190px;display:flex;align-items:flex-end;box-shadow:var(--sh)}
.hero h1{color:#fff;font-size:32px}.hero p{color:#CFE6EC;margin:8px 0 0;max-width:560px}
.hero svg.sky{position:absolute;left:0;bottom:0;width:55%;height:100%;opacity:.95;pointer-events:none}
@media(max-width:900px){.hero svg.sky{width:100%;opacity:.3}}
.hero .hx{position:relative;z-index:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:20px 0}
.kpi{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:18px 20px;display:flex;flex-direction:column;gap:4px;border-top:4px solid var(--brand2)}
.kpi span{font-size:14px;color:var(--mute)}
.kpi b{font-family:Rubik,sans-serif;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi i{font-style:normal;font-size:13px;color:var(--mute)}
.kpi.warn{border-top-color:#F0A500}.kpi.ok{border-top-color:#2FBF71}.kpi.navy{border-top-color:var(--brand)}
.dgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px}
.bars{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.bar{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:14px}
.bar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{height:12px;background:var(--soft);border-radius:8px;overflow:hidden}
.bar .track i{display:block;height:100%;background:linear-gradient(90deg,#0A7E8C,#0B3954);border-radius:8px}
.bar b{font-variant-numeric:tabular-nums;text-align:left;direction:ltr}
.stack{display:flex;height:22px;border-radius:10px;overflow:hidden;margin:12px 0}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;background:var(--c)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.st-new{background:#E8EEF3;color:#3E5566}.st-check{background:var(--warn);color:var(--warnInk)}.st-ready{background:var(--brandSoft);color:var(--brand)}.st-done{background:var(--mint);color:var(--mintInk)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.head p{margin:6px 0 0;color:var(--mute)}
/* stepper */
.steps{display:flex;gap:0;margin:18px 0 22px;background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:8px}
.steps button{flex:1;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;gap:12px;padding:12px 16px;text-align:start}
.steps button .c{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:Rubik,sans-serif;font-weight:700;background:var(--soft);color:var(--mute);flex:none}
.steps button b{display:block;font-size:16px}.steps button span{font-size:13px;color:var(--mute)}
.steps button.on{background:var(--brandSoft)}.steps button.on .c{background:var(--brand);color:#fff}
.steps button.done .c{background:#2FBF71;color:#fff}
/* tables */
table{border-collapse:collapse;width:100%}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
th{font-size:13px;color:var(--mute);font-weight:700;background:#F7FAFB;position:sticky;top:0;z-index:1}
td.n,th.n{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap;direction:ltr}
td input,td select{padding:5px 7px;font-size:15px;border-color:transparent;background:transparent}
td input:hover,td select:hover{border-color:var(--line)}td input:focus,td select:focus{border-color:var(--brand2);background:#fff}
td input.num{text-align:left;direction:ltr;font-variant-numeric:tabular-nums}
tr.grp td{background:#F2F6F8;font-weight:700}
tr.sec td{background:var(--brand);color:#fff;font-family:Rubik,sans-serif;font-weight:600;font-size:15px}
tr.tot td{background:#EAF3F5;font-weight:700}
tr.big td{background:var(--mint);font-weight:800}
.list tbody tr{cursor:pointer}.list tbody tr:hover td{background:#F7FAFB}
.tblwrap{background:var(--card);border-radius:14px;box-shadow:var(--sh);overflow:auto}
.rt{min-width:1180px}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:12px;background:var(--soft);white-space:nowrap}
.chip.pdf,.chip.sug{background:var(--warn);color:var(--warnInk)}.chip.man,.chip.conf{background:var(--mint);color:var(--mintInk)}.chip.miss{background:var(--bad);color:var(--badInk)}
.badge{display:inline-block;min-width:22px;padding:0 8px;border-radius:20px;font-size:13px;font-weight:700;background:var(--soft)}
.badge.w{background:var(--warn);color:var(--warnInk)}.badge.ok{background:var(--mint);color:var(--mintInk)}.badge.b{background:var(--bad);color:var(--badInk)}
/* read step */
.drop{border:2px dashed #C5D3DC;border-radius:18px;padding:36px 20px;text-align:center;background:var(--card)}
.drop.over{border-color:var(--brand2);background:var(--brandSoft)}
.drop svg{width:56px;height:56px;color:var(--brand2)}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;margin-top:16px}
.pg{border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--card);font-size:13px;box-shadow:var(--sh)}
.pg img{width:100%;display:block;border-radius:6px;background:#fff}
.pg div{overflow-wrap:anywhere}.pg.done{border-color:#2FBF71}.pg.err{border-color:var(--badInk)}.pg.run{border-color:#F0A500}
.prog{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:12px 0}.prog i{display:block;height:100%;background:var(--brand2);transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px 22px}
.fld label{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--mute);margin-bottom:5px}
.q{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:16px;margin-bottom:12px;display:grid;gap:10px}
.q .h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chk{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:0 0 16px}
.chk div{padding:12px 14px;border-radius:12px;background:var(--card);box-shadow:var(--sh);border-inline-start:5px solid #F0A500;font-size:15px}
.chk div.ok{border-inline-start-color:#2FBF71}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}.seg button{border:0;border-radius:0;min-height:36px}.seg button.on{background:var(--brand);color:#fff}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:10px 14px;margin-bottom:12px;position:sticky;top:0;z-index:4}
.export{background:linear-gradient(120deg,#0B3954,#0A7E8C);color:#fff;border-radius:16px;padding:20px 22px;margin-top:18px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
.export label{display:flex;gap:10px;align-items:center;font-weight:700}
.export button.pri{background:#fff;color:var(--brand);border-color:#fff}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(46vw,720px);background:#fff;box-shadow:0 0 40px rgba(0,0,0,.25);z-index:20;display:flex;flex-direction:column}
.drawer .bar2{display:flex;gap:6px;align-items:center;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.drawer .img{flex:1;overflow:auto;background:var(--soft)}
.drawer img{display:block;background:#fff}
/* settings */
.stabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.stabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#122230;color:#fff;padding:11px 18px;border-radius:12px;z-index:40;display:flex;gap:12px;align-items:center;max-width:92vw;box-shadow:var(--sh)}
.toast button{background:transparent;color:#fff;border-color:#fff;min-height:30px;padding:2px 10px}
.dlg{position:fixed;inset:0;background:rgba(8,30,45,.45);display:grid;place-items:center;z-index:30;padding:14px}
.dlg>div{background:#fff;border-radius:16px;padding:22px;max-width:620px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--sh)}
.empty{text-align:center;padding:40px 20px}.empty svg{width:120px;height:90px}
@media(max-width:1100px){.dgrid{grid-template-columns:1fr}}
.tbx{display:contents}.mob,.pcards{display:none}
.pcard{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:14px 16px;display:grid;gap:8px;cursor:pointer}
.pk{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pk span{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--mute)}.pk b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
@media(max-width:700px){
 main{padding:16px 12px 50px}h1{font-size:24px}
 .list.ptbl{display:none}.pcards{display:grid;gap:12px}
 .toolbar{position:static}.mob{display:inline-flex}.tbx{display:none}.toolbar.open .tbx{display:flex;flex-wrap:wrap;gap:8px;width:100%}
 .tblwrap{overflow:visible;background:transparent;box-shadow:none}
 #pv{min-width:0}#pv thead{display:none}#pv,#pv tbody{display:block}
 #pv tr{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;background:var(--card);border-radius:12px;box-shadow:var(--sh);margin-bottom:10px;padding:8px}
 #pv td{display:block;border:0;padding:4px 6px;grid-column:1/-1;min-width:0!important}
 #pv td[data-l]::before{content:attr(data-l);display:block;font-size:12px;color:var(--mute);font-weight:600}
 #pv td.n{grid-column:auto;text-align:start}#pv td.n.c0{grid-column:1/-1}#pv td.e{display:none}#pv td.e2{text-align:start}
 #pv td input,#pv td select{border-color:var(--line);background:#fff}
 #pv tr.sec{display:block;background:var(--brand);padding:10px 12px}#pv tr.sec td{background:transparent;padding:0}
 #pv tr.tot,#pv tr.big{background:#EAF3F5}#pv tr.big{background:var(--mint)}
 .export{flex-direction:column;align-items:stretch}.export button.pri{width:100%}
 .steps button{padding:8px 10px}.head .row{width:100%}
}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}.brand{border:0;padding:0}.nav{flex-direction:row;flex-wrap:wrap}.side-foot{display:none}.steps{flex-direction:column}.drawer{width:100vw}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script type="module">
const C = window.FA_CONFIG, B = "https://www.gstatic.com/firebasejs/12.18.0/";
window.FA_BACKEND = (async () => {
  if (!C.firebase || !C.firebase.apiKey) return { mode: "local" };
  const { initializeApp } = await import(B + "firebase-app.js");
  const app = initializeApp(C.firebase);
  if (C.recaptchaSiteKey) {
    try { const ac = await import(B + "firebase-app-check.js");
      ac.initializeAppCheck(app, { provider: new ac.ReCaptchaV3Provider(C.recaptchaSiteKey), isTokenAutoRefreshEnabled: true }); }
    catch (e) { console.warn("App Check", e); }
  }
  const rt = await import(B + "firebase-database.js");
  const db = rt.getDatabase(app);
  const wrap = (id, v) => ({ id, exists: v != null, data: () => v });
  const q = (path, o) => ({
    orderBy: (f, d) => q(path, { ...o, f, d: d || "asc" }),
    limit: n => q(path, { ...o, n }),
    get: async () => {
      const v = (await rt.get(rt.ref(db, path))).val() || {};
      let docs = Object.entries(v).map(([k, x]) => wrap(k, x));
      if (o.f) docs.sort((a, b) => ((a.data()[o.f] || 0) - (b.data()[o.f] || 0)) * (o.d === "desc" ? -1 : 1));
      if (o.n) docs = docs.slice(0, o.n);
      return { docs };
    }
  });
  const dbA = {
    collection: p => q(p, {}),
    doc: p => ({
      get: async () => { const s = await rt.get(rt.ref(db, p)); return wrap(p.split("/").pop(), s.val()); },
      set: d => rt.set(rt.ref(db, p), JSON.parse(JSON.stringify(d))),
      delete: () => rt.remove(rt.ref(db, p))
    })
  };
  const sample = null;
  return { mode: "firebase", db: dbA, sample };
})();
</script>

<script>
/* ===== EXPORT (pure; also tested outside the page) ===== */
const CATS={exec:'ביצוע (קבלן)',plan:'תכנון ויועצים',mgmt:'ניהול ופיקוח',fee:'עמלת חברה מנהלת',levy:'אגרות, היטלים ומעבדות',skip:'לא לכלול'};
function normName(s){return String(s||'').replace(/בע["״']?מ/g,'').replace(/["'״׳.,\-()]/g,'').replace(/\s+/g,' ').trim()}
function gkey(r){return normName(r.sup)+'|'+normName(r.svc)}
function fmtD(iso){if(!iso)return'';const m=String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:String(iso)}
function fmtDT(d){const p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`}
function vatFor(iso,rates){let r=rates[0]?rates[0].rate:18;for(const x of [...rates].sort((a,b)=>a.from<b.from?-1:1)){if(!iso||x.from<=iso)r=x.rate}return r}
function buildLines(P,grouped){
  const L={exec:[],plan:[],mgmt:[],fee:[],levy:[]};
  const rows=(P.rows||[]).map((r,i)=>[r,r.ord!=null?r.ord:i+1e6]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]).filter(r=>r.cat&&r.cat!=='skip'&&L[r.cat]);
  if(!grouped){rows.forEach(r=>L[r.cat].push({sup:r.sup,svc:r.svc,date:r.date||'',excl:+r.excl||0,incl:+r.incl||0,note:r.note||'',ids:[r.id]}));return L}
  const m=new Map();
  rows.forEach(r=>{const k=r.cat+'§'+gkey(r);if(!m.has(k)){const o={sup:r.sup,svc:r.svc,date:'',excl:0,incl:0,n:0,notes:[],ids:[]};m.set(k,o);L[r.cat].push(o)}const o=m.get(k);o.excl+=+r.excl||0;o.incl+=+r.incl||0;o.n++;o.ids.push(r.id);if(r.date&&r.date>o.date)o.date=r.date;if(r.note)o.notes.push(r.note)});
  for(const k in L)L[k].forEach(o=>{o.note=(o.n>1?`מאוחד מ-${o.n} שורות`:'')+(o.notes.length?(o.n>1?'; ':'')+o.notes.join('; '):'')});
  return L;
}

  const isAmt = t => { const c = clean(t).replace(/[\[\]|=<>{}()₪]/g, ''); return /^-?[\d.,]*\d[\d.,]*-?$/.test(c) && (c.match(/\d/g) || []).length >= 3 && !/\d-\d|\//.test(c); };
  const isMoney = t => isAmt(t) && /[.,]\d{2}-?$/.test(clean(t).replace(/[\[\]|=<>{}()₪]/g, ''));
  const heb = t => (String(t).match(/[א-ת]/g) || []).length;
  const words = (lines, imgW) => {
    const F = imgW ? 1654 / imgW : 1;
    return lines.map(l => {
      const ws = (l.words || []).map(w => ({ t: clean(w.text), c: w.confidence, x0: w.bbox.x0 * F, x1: w.bbox.x1 * F, y0: w.bbox.y0 * F, y1: w.bbox.y1 * F })).filter(w => w.t && !/^[|\[\]=_]+$/.test(w.t));
      return { ws, text: ws.slice().sort((a, b) => b.x0 - a.x0).map(w => w.t).join(' '), y0: Math.min(...ws.map(w => w.y0)), y1: Math.max(...ws.map(w => w.y1)) };
    }).filter(l => l.ws.length);
  };
  function project(L) {
    const all = L.map(l => l.text).join('\n'), p = {}; let m;
    if ((m = all.match(/פרויקט[:\s]+(\d{2,6})\b/))) p.number = m[1];
    if ((m = all.match(/תאריך\s*(?:דרישה|חשבון|חשבונית)?[^\n\d]{0,12}(\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4})/))) p.date = m[1];
    const i = L.findIndex(l => /^(בפרויקט|פרויקט|הנדון)[:\s]/.test(l.text));
    if (i >= 0) { const nm = L[i].text.replace(/^(בפרויקט|פרויקט|הנדון)[:\s]*/, '').replace(/^-/, '').trim(); if (nm && !/^\d+$/.test(nm)) p.name = nm; }
    return p;
  }
  /* split the page's table into columns by where words fall across many rows */
  function table(lines, imgW) {
    const L = words(lines, imgW);
    const out = { project: project(L), cols: [], rows: [], header: [] };
    // the table = the densest vertical run of lines that carry money amounts
    const mon = L.filter(l => l.ws.some(w => isMoney(w.t)) && l.ws.length >= 2);
    if (mon.length < 2) return out;
    const gaps = mon.slice(1).map((l, i) => l.y0 - mon[i].y0).sort((a, b) => a - b), med = gaps[Math.floor(gaps.length / 2)] || 30;
    const blocks = [[mon[0]]]; mon.slice(1).forEach((l, i) => { if (l.y0 - mon[i].y0 > Math.max(3.2 * med, 60)) blocks.push([l]); else blocks[blocks.length - 1].push(l); });
    const blk = blocks.reduce((a, b) => b.length > a.length ? b : a);
    const yA = blk[0].y0 - 2, yB = blk[blk.length - 1].y1 + 2;
    const cand = L.filter(l => l.y0 >= yA && l.y1 <= yB + med && l.ws.some(w => isAmt(w.t)) && l.ws.length >= 2);
    if (cand.length < 2) return out;
    const W = 1800, cov = new Uint16Array(W);
    cand.forEach(l => l.ws.forEach(w => { for (let x = Math.max(0, Math.floor(w.x0)); x < Math.min(W, Math.ceil(w.x1)); x++) cov[x]++; }));
    const th = Math.max(2, Math.ceil(cand.length * 0.12));
    let segs = [], s = -1;
    for (let x = 0; x <= W; x++) { const on = x < W && cov[x] >= th; if (on && s < 0) s = x; if (!on && s >= 0) { segs.push({ lo: s, hi: x }); s = -1; } }
    for (let i = 1; i < segs.length; i++) if (segs[i].lo - segs[i - 1].hi < 7) { segs[i - 1].hi = segs[i].hi; segs.splice(i, 1); i--; }
    if (!segs.length) return out;
    segs.sort((a, b) => b.lo - a.lo);                       // right-to-left: first column is the rightmost
    const pick = w => { const x = (w.x0 + w.x1) / 2; let k = segs.findIndex(g => x >= g.lo - 4 && x <= g.hi + 4); if (k < 0) { let d = 1e9; segs.forEach((g, i) => { const dd = Math.min(Math.abs(x - g.lo), Math.abs(x - g.hi)); if (dd < d) { d = dd; k = i; } }); } return k; };
    const cellOf = (ws, numeric) => numeric ? ws.slice().sort((a, b) => a.x0 - b.x0).map(w => w.t).join('') : ws.slice().sort((a, b) => b.x0 - a.x0).map(w => w.t).join(' ');
    const first = L.indexOf(cand[0]), rh = (cand[cand.length - 1].y1 - cand[0].y0) / Math.max(1, cand.length);
    const head = []; for (let i = first - 1; i >= 0 && i >= first - 3; i--) { if (L[i].ws.some(w => isMoney(w.t)) || cand[0].y0 - L[i].y1 > 4 * rh) break; head.unshift(L[i]); }
    const hdr = segs.map(() => []); head.forEach(l => l.ws.forEach(w => hdr[pick(w)].push(w)));
    const grid = cand.map(l => { const c = segs.map(() => []); l.ws.forEach(w => c[pick(w)].push(w)); return { l, c }; });
    out.cols = segs.map((g, k) => {
      const cells = grid.map(r => r.c[k]).filter(c => c.length);
      const numeric = cells.filter(c => c.every(w => isAmt(w.t) || /^[\d.,\-]+$/.test(w.t))).length;
      const money = cells.filter(c => c.some(w => isMoney(w.t))).length;
      const hb = cells.reduce((a, c) => a + heb(c.map(w => w.t).join('')), 0);
      return { lo: g.lo, hi: g.hi, title: cellOf(hdr[k], false), filled: cells.length, money: cells.length ? money / cells.length : 0, numeric: cells.length ? numeric / cells.length : 0, heb: cells.length ? hb / cells.length : 0 };
    });
    out.rows = grid.map(r => ({ y: r.l.y0, cells: r.c.map((ws, k) => ({ t: cellOf(ws, out.cols[k].numeric > 0.5), c: ws.length ? Math.min(...ws.map(w => w.c)) : 100 })) }));
    out.header = out.cols.map(c => c.title);
    return out;
  }
  const sigOf = T => T.header.map(h => h.replace(/[^א-תa-z]/gi, '')).join('|');
  const sim = (a, b) => { const A = new Set(a.split(/[|\s]+/).filter(Boolean)), B = new Set(b.split(/[|\s]+/).filter(Boolean)); if (!A.size || !B.size) return 0; let n = 0; A.forEach(x => { if (B.has(x)) n++; }); return n / Math.max(A.size, B.size); };
  const fitsR = (e, i, rates) => e > 0 && i > 0 && rates.some(r => Math.abs(i / e - (1 + r / 100)) < 0.0025);
  /* guess roles: a remembered template first, then the VAT ratio between two amount columns */
  function guess(T, templates, rates) {
    const n = T.cols.length, roles = Array(n).fill('');
    const sig = sigOf(T);
    let best = null, bs = 0;
    (templates || []).forEach(t => { if (t.n !== n) return; const s = sim(t.sig, sig); if (s > bs) { bs = s; best = t; } });
    if (best && bs >= 0.5) return { roles: best.roles.slice(), from: 'template' };
    const amtCols = T.cols.map((c, k) => k).filter(k => T.cols[k].money >= 0.5);
    const vals = k => T.rows.map(r => toNum(r.cells[k].t));
    const P = [];
    amtCols.forEach(a => amtCols.forEach(b => { if (a === b) return; const va = vals(a), vb = vals(b); let c = 0; va.forEach((x, i) => { if (fitsR(x, vb[i], rates)) c++; });
      const t = T.cols[b].title, pref = (/כולל/.test(t) ? 1 : 0) - (/ללא|לפני/.test(t) ? 2 : 0);
      P.push({ a, b, c, pref, sumB: vb.reduce((s, x) => s + (x || 0), 0) }); }));
    const top = Math.max(0, ...P.map(p => p.c));
    const pair = P.filter(p => p.c >= top * 0.75 && p.c > 0).sort((x, y) => y.pref - x.pref || y.c - x.c || y.sumB - x.sumB)[0] || null, pc = pair ? pair.c : 0;
    if (pair && pc >= Math.max(2, T.rows.length * 0.3)) { roles[pair.a] = 'excl'; roles[pair.b] = 'incl'; }
    else if (amtCols.length) {
      const h = k => T.cols[k].title;
      const ex = amtCols.find(k => /לפני|ללא\s*מע/.test(h(k))), inc = amtCols.find(k => /כולל\s*מע|כולל/.test(h(k)) && !/ללא|לפני/.test(h(k)));
      if (ex != null) roles[ex] = 'excl';
      if (inc != null && inc !== ex) roles[inc] = 'incl';
      if (ex == null && inc == null) roles[amtCols.reduce((a, b) => T.cols[a].lo < T.cols[b].lo ? a : b)] = 'incl';   // leftmost amount
    }
    const DRE = /\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4}/;
    const dc = T.cols.map((c, k) => k).filter(k => !roles[k]).map(k => ({ k, n: T.rows.filter(r => DRE.test(r.cells[k].t)).length })).sort((a, b) => b.n - a.n)[0];
    if (dc && dc.n >= Math.max(2, T.rows.length * 0.4) && T.cols[dc.k].heb < 3) roles[dc.k] = 'date';
    const text = T.cols.map((c, k) => k).filter(k => !roles[k] && T.cols[k].heb >= 3 && T.cols[k].numeric < 0.5).sort((a, b) => T.cols[b].lo - T.cols[a].lo);
    if (text[0] != null) roles[text[0]] = 'sup';
    if (text[1] != null) roles[text[1]] = 'svc';
    return { roles, from: 'guess' };
  }
  /* turn mapped table rows into account rows, with checks and repairs */
  function apply(T, roles, rates) {
    const k = r => roles.indexOf(r), ks = roles.map((r, i) => r === 'svc' ? i : -1).filter(i => i >= 0);
    const out = { rows: [], totalIncl: null, totalExcl: null };
    T.rows.forEach(R => {
      const DRE = /(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/;
      let sup = k('sup') >= 0 ? R.cells[k('sup')].t : '';
      let date = k('date') >= 0 ? R.cells[k('date')].t : '';
      let dm = (date.match(DRE) || sup.match(DRE));
      sup = sup.replace(new RegExp(DRE.source, 'g'), ' ');
      // leading row numbers / garbled dates / stray marks that stuck to the supplier name
      sup = sup.replace(/^[\s\d|\/.\[\],;:°'"\-_]+(?=[א-תA-Za-z])/, '').replace(/^[\\\/|,.°'"\-_ ]+/, '').replace(/\s+/g, ' ').trim();
      const iso = dm ? (() => { let y = +dm[3]; if (y < 100) y += 2000; const d = +dm[1], m = +dm[2]; return d >= 1 && d <= 31 && m >= 1 && m <= 12 ? `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}` : ''; })() : '';
      const svc = ks.map(i => R.cells[i].t).filter(Boolean).join(' ').trim();
      let e = k('excl') >= 0 ? toNum(R.cells[k('excl')].t) : null, inc = k('incl') >= 0 ? toNum(R.cells[k('incl')].t) : null;
      const lowC = ['excl', 'incl'].some(r => k(r) >= 0 && R.cells[k(r)].t && R.cells[k(r)].c < 70);
      if (/סה["״']?[כב]/.test(sup + ' ' + svc)) { if (inc) out.totalIncl = inc; if (e) out.totalExcl = e; return; }
      if (/תקציב|אחוז\s*ניצול|מאושר/.test(sup)) return;
      if (!sup && !svc) return;
      if (e == null && inc == null) return;
      let ok, note = '';
      if (e != null && inc != null) {
        ok = fitsR(e, inc, rates);
        if (!ok) for (const [de, di] of [[100, 100], [1, 100], [100, 1]]) if (fitsR(e / de, inc / di, rates)) { e = Math.round(e / de * 100) / 100; inc = Math.round(inc / di * 100) / 100; ok = true; note = 'תוקנה נקודה עשרונית שלא זוהתה'; break; }
        if (!ok) { const lead = v => String(Math.floor(Math.abs(v))).slice(0, 4);
          for (const r of rates) { const ci = e * (1 + r / 100), ce = inc / (1 + r / 100);
            if (inc < ci * 0.5 && lead(inc).length >= 3 && String(Math.floor(ci)).startsWith(lead(inc))) { inc = null; note = 'ספרות חסרות בסכום כולל מע"מ – חושב מהסכום ללא מע"מ'; break; }
            if (e < ce * 0.5 && lead(e).length >= 3 && String(Math.floor(ce)).startsWith(lead(e))) { e = null; note = 'ספרות חסרות בסכום ללא מע"מ – חושב מהסכום כולל מע"מ'; break; } } }
      } else ok = true;                                     // one amount only: nothing to cross-check
      out.rows.push({ sup: sup || svc, svc: sup ? svc : '', date: iso, excl: e, incl: inc, ok: ok && !lowC, note });
    });
    if (out.rows.length > 2) {                              // last row equal to the sum above it = the table's total
      const last = out.rows[out.rows.length - 1], v = x => x.incl != null ? x.incl : x.excl;
      const rest = out.rows.slice(0, -1).reduce((a, r) => a + (v(r) || 0), 0);
      if (v(last) && (Math.abs(v(last) - rest) / Math.abs(v(last)) < 0.03 || (out.rows.slice(0, -1).every(r => (v(r) || 0) < v(last)) && v(last) > 0.8 * rest))) {
        out.rows.pop(); if (!out.totalIncl && last.incl) out.totalIncl = last.incl; if (!out.totalExcl && last.excl) out.totalExcl = last.excl; }
    }
    const tot = out.totalIncl || out.totalExcl;
    if (tot) out.rows.forEach(r => ['incl', 'excl'].forEach(f => { if (r[f] > tot * 1.01 && r[f] / 100 <= tot) { r[f] = Math.round(r[f]) / 100; r.ok = false; r.note = 'תוקנה נקודה עשרונית שלא זוהתה'; } }));
    return out;
  }
  return { table, guess, apply, sigOf, toNum };
})();

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(n==null||n===''||isNaN(n))?'':Number(n).toLocaleString('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>Number(n||0).toLocaleString('he-IL',{maximumFractionDigits:0});
const num=v=>{if(v==null||v==='')return null;const n=Number(String(v).replace(/[^\d.\-]/g,''));return isNaN(n)?null:n};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const hash=s=>{let h=2166136261;for(const c of String(s)){h^=c.codePointAt(0);h=Math.imul(h,16777619)>>>0}return 'k'+h.toString(36)};
const DEFAULT_VAT=[{from:'2012-09-01',rate:17},{from:'2013-06-02',rate:18},{from:'2015-10-01',rate:17},{from:'2025-01-01',rate:18}];
const FIELDS=[['num','מס\' פרויקט',0],['name','שם הפרויקט',1],['desc','תיאור הפרויקט (תכולה)',1,'ta'],['area','שטח בניה עפ"י היתר (מ"ר)',1,'num'],['devArea','שטח פיתוח (מ"ר)',0,'num'],['company','חברה מבצעת',1],['pm','מנהל פרויקט הנדסי',0],['finalDate','תאריך חשבון סופי',1,'date'],['deliveryDate','תאריך מסירה',1,'date'],['index','מדד תשומות הבנייה בתאריך החשבון',0,'num'],['devCost','עלות פיתוח למ"ר (הנחת עבודה)',0,'num'],['bnm','ב.נ.מ. לניכוי (%)',0,'num']];
const S={view:'list',projects:[],P:null,sup:{},vat:DEFAULT_VAT,pages:[],tab:'read',grouped:true,open:{},db:null,sample:null,dl:null,q:'',zoom:1,pageSel:0,reading:false,undo:null,expGrouped:false,gen:{},tpl:[]};
let saveT=null,saving=false,dirty=false;

/* ---------- storage ---------- */
const LS={get(k){try{return JSON.parse(localStorage.getItem('fa_'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('fa_'+k,JSON.stringify(v))}catch(e){}}};
async function loadAll(){
  if(S.db){
    const TO=(p,ms)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j({code:'timeout'}),ms))]);
    try{const q=await TO(S.db.collection('projects').orderBy('updatedAt','desc').limit(300).get(),12000);S.projects=q.docs.map(d=>d.data())}
    catch(e){S.dbErr=e.code==='timeout'?'אין חיבור למסד הנתונים. ודאו שחוקי Realtime Database מאפשרים קריאה וכתיבה.':'לא ניתן לטעון פרויקטים: '+(e.message||e.code);toast(S.dbErr);return}
    try{const q=await S.db.collection('suppliers').limit(1000).get();S.sup={};q.docs.forEach(d=>{S.sup[d.id]=d.data()})}catch(e){}
    try{const q=await S.db.collection('templates').limit(500).get();S.tpl=q.docs.map(d=>d.data())}catch(e){}
    try{const g=await S.db.doc('settings/general').get();if(g.exists)S.gen=g.data()||{}}catch(e){}
    try{const v=await S.db.doc('settings/vat').get();if(v.exists&&Array.isArray(v.data().rates))S.vat=v.data().rates}catch(e){}
  }else{S.projects=LS.get('projects')||[];S.sup=LS.get('sup')||{};S.vat=LS.get('vat')||DEFAULT_VAT;S.tpl=LS.get('tpl')||[];S.gen=LS.get('gen')||{}}
}
function touch(){if(!S.P)return;S.P.updatedAt=Date.now();dirty=true;$('#saveSt').textContent='שינויים לא שמורים…';clearTimeout(saveT);saveT=setTimeout(save,1200)}
async function save(){
  if(!S.P||saving){if(saving){clearTimeout(saveT);saveT=setTimeout(save,800)}return}
  saving=true;dirty=false;const P=JSON.parse(JSON.stringify(S.P));
  try{
    if(S.db)await S.db.doc('projects/'+P.id).set(P);
    else{const a=(LS.get('projects')||[]).filter(x=>x.id!==P.id);a.unshift(P);LS.set('projects',a)}
    const i=S.projects.findIndex(x=>x.id===P.id);if(i>=0)S.projects[i]=P;else S.projects.unshift(P);
    $('#saveSt').textContent='נשמר '+fmtDT(new Date()).slice(11);
  }catch(e){$('#saveSt').textContent='השמירה נכשלה';toast(e.code==='quota_exceeded'?'אין מקום לשמירה: '+e.message:'השמירה נכשלה, ננסה שוב');dirty=true;setTimeout(save,4000)}
  saving=false;
}
async function rememberSupplier(r,cat){
  const keys=[hash(normName(r.sup)+'|'+normName(r.svc)),hash(normName(r.sup))];
  const body={sup:r.sup,svc:r.svc,cat,at:Date.now()};
  for(const k of keys){S.sup[k]={...body,svc:k===keys[1]?'':r.svc};
    if(S.db){try{await S.db.doc('suppliers/'+k).set(S.sup[k])}catch(e){}}}
  if(!S.db)LS.set('sup',S.sup);
}
async function saveTemplate(T,roles){
  const sig=OT.sigOf(T),t={sig,roles,n:T.cols.length,header:T.header,at:Date.now()};
  S.tpl=(S.tpl||[]).filter(x=>x.sig!==sig);S.tpl.push(t);
  if(S.db){try{await S.db.doc('templates/'+hash(sig)).set(t)}catch(e){}}else LS.set('tpl',S.tpl);
}
async function saveVat(){if(S.db){try{await S.db.doc('settings/vat').set({rates:S.vat})}catch(e){toast('לא נשמר')}}else LS.set('vat',S.vat)}

/* ---------- classification ---------- */
const RULES=[
 ['fee',/עמלת|עמלה|עו["״]?ב|תקורה/],
 ['levy',/חברת ה?חשמל|חח["״]?י|מי אביבים|תאגיד מים|רשות|עירי|מכון התקנים|כבאות|כיבוי|אגרה|אגרות|היטל|פיצוי נופי|מעבד|מכון בקרה|התעדה|דמי הקמה|רשות העתיקות|בזק/],
 ['mgmt',/ניהול פרו|מנהל פרו|ניהול ופיקוח|^פיקוח|ניהול פרויקט/],
 ['exec',/קבלן|ביצוע|התייקרות|ביטוח|ניקיון|גיזום|כ["״]?א|כוח אדם|עבודות/],
 ['plan',/אדריכל|יועץ|ייעוץ|יעוץ|תכנון|קונסטרוק|שלד|אינסטלצ|חשמל|תקשורת|מיזוג|אקוסטי|מודד|מדידות|נגישות|בטיחות|מיגון|העתקות|צילום|צלם|הידרולוג|קרקע|גאוטכני|איטום|תנועה|בני.?ה ירוקה|אגרונום|מעלי|כמאי|הדמי|תאום|תיאום|סופרפוזיציה|נוף|תברואה|מתזים|פרוגרמה|מטבח|תשתיות|קרינה|מהנדס/]];
function suggest(r,ai){
  const d=S.sup[hash(normName(r.sup)+'|'+normName(r.svc))]||S.sup[hash(normName(r.sup))];
  if(d&&d.cat)return {cat:d.cat,src:'dict'};
  const txt=(r.svc||'')+' '+(r.sup||'');
  for(const [c,re] of RULES){if(re.test(r.svc||'')||(c==='levy'||c==='fee')&&re.test(r.sup||''))return {cat:c,src:'rule'}}
  if(ai&&ai.cat&&ai.cat!=='unknown'&&ai.conf>=0.8)return {cat:ai.cat,src:'ai'};
  for(const [c,re] of RULES){if(re.test(txt))return {cat:c,src:'rule'}}
  return {cat:'',src:''};
}
function classifyAll(onlyEmpty=true){(S.P.rows||[]).forEach(r=>{if(onlyEmpty&&r.cat)return;const s=suggest(r,r.ai);r.cat=s.cat;r.catSrc=s.src})}

/* ---------- VAT ---------- */
function projVat(){return S.P.vatOverride?+S.P.vatOverride:vatFor(S.P.finalDate,S.vat)}
function fixVat(r){
  const rate=r.rate!=null?+r.rate:projVat(),rd=x=>Math.round(x*100)/100;
  if(r.calc!=='excl'&&r.calc!=='incl'){if(r.excl==null&&r.incl!=null)r.calc='excl';else if(r.incl==null&&r.excl!=null)r.calc='incl';else return}
  if(r.calc==='excl'){if(r.incl==null){r.excl=null;r.calc='';return}r.excl=rd(r.incl/(1+rate/100))}
  else{if(r.excl==null){r.incl=null;r.calc='';return}r.incl=rd(r.excl*(1+rate/100))}
}
function implied(r){if(!r.excl||!r.incl)return null;return (r.incl/r.excl-1)*100}
function vatFlag(r){const i=implied(r);if(i==null||r.calc||r.vatOk)return '';const known=[...new Set(S.vat.map(x=>x.rate))];return known.some(k=>Math.abs(i-k)<0.15)?'':'⚠'}

async function loadPdf(file){
  if(!window.pdfjsLib){toast('רכיב קריאת PDF לא נטען');return}
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;S.pdfDoc=pdf;
  S.pages.forEach(p=>URL.revokeObjectURL(p.url));S.pages=[];
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i);const v0=page.getViewport({scale:1});const sc=Math.min(2.4,1700/v0.width);
    const vp=page.getViewport({scale:sc});const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
    const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);
    await page.render({canvasContext:cx,viewport:vp}).promise;
    const blob=await new Promise(res=>cv.toBlob(res,'image/jpeg',0.85));
    S.pages.push({n:i,blob,url:URL.createObjectURL(blob),use:true,st:''});
    render();
  }
  if(S.P){S.P.pdfName=file.name;S.P.pages=pdf.numPages;touch()}
  render();
}
function parseJSON(t){t=String(t||'').replace(/```json|```/g,'');const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)throw new Error('no json');return JSON.parse(t.slice(a,b+1))}

function toISO(s){if(!s)return '';const m=String(s).match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);if(!m)return '';let y=+m[3];if(y<100)y+=2000;return `${y}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`}
let ocrWorker=null;
async function ocrCanvas(n){
  const page=await S.pdfDoc.getPage(n);const v0=page.getViewport({scale:1});const vp=page.getViewport({scale:Math.min(4,2480/v0.width)});
  const cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);const cx=cv.getContext('2d',{willReadFrequently:true});
  cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);await page.render({canvasContext:cx,viewport:vp}).promise;
  const W=cv.width,H=cv.height,img=cx.getImageData(0,0,W,H),d=img.data,row=new Uint32Array(H),col=new Uint32Array(W);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;if(d[i]*.3+d[i+1]*.59+d[i+2]*.11<160){row[y]++;col[x]++}}
  const wipe=(i)=>{d[i]=d[i+1]=d[i+2]=255};
  for(let y=0;y<H;y++)if(row[y]>W*.35)for(let x=0;x<W;x++)wipe((y*W+x)*4);
  for(let x=0;x<W;x++)if(col[x]>H*.25)for(let y=0;y<H;y++)wipe((y*W+x)*4);
  cx.putImageData(img,0,0);return cv;
}
async function readPdf(){
  if(!window.Tesseract){toast('רכיב זיהוי הטקסט לא נטען – בדקו חיבור לאינטרנט');return}
  const pages=S.pages.filter(p=>p.use);if(!pages.length)return;
  S.reading=true;render();
  const P=S.P;let added=0,flagged=0,tables=0;
  try{
    if(!ocrWorker){S.ocrMsg='טוען מילון עברית (פעם ראשונה בלבד)…';render();
      ocrWorker=await Tesseract.createWorker('heb+eng',1,{logger:m=>{if(m.status==='recognizing text'&&S.ocrPage){S.ocrPage.pct=Math.round(m.progress*100);const el=document.querySelector(`[data-st="${S.ocrPage.n}"]`);if(el)el.textContent=`מזהה… ${S.ocrPage.pct}%`}}});
      await ocrWorker.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});S.ocrMsg='';}
  }catch(e){S.reading=false;S.ocrMsg='';toast('לא ניתן לטעון את רכיב זיהוי הטקסט');render();return}
  const rates=[...new Set([projVat(),...S.vat.map(x=>x.rate)])];S.tabs=[];
  for(const pg of pages){
    pg.st='run';pg.err='';S.ocrPage=pg;render();
    try{
      const cv=S.pdfDoc?await ocrCanvas(pg.n):null;
      const {data}=await ocrWorker.recognize(cv||pg.blob);
      const T=OT.table(data.lines||[],cv?cv.width:1654);
      const pj=T.project||{};
      const setF=(k,v)=>{if(v==null||v==='')return;if(P[k]==null||P[k]===''){P[k]=v;P.src[k]='pdf'}};
      setF('num',pj.number);setF('name',pj.name);setF('finalDate',toISO(pj.date));
      if(T.rows.length>=2){const g=OT.guess(T,S.tpl,rates);S.tabs.push({page:pg.n,T,roles:g.roles,from:g.from});pg.err=`טבלה: ${T.rows.length} שורות, ${T.cols.length} עמודות`}
      else pg.err='לא נמצאה טבלה בעמוד';
      pg.st='done';touch();
    }catch(e){console.error(e);pg.st='err';pg.err='הזיהוי נכשל בעמוד זה'}
    render();
  }
  S.ocrPage=null;S.reading=false;
  toast(S.tabs.length?'בדקו את סימון העמודות ולחצו "קליטת השורות"':'לא נמצאה טבלה בעמודים שנבחרו');
  render();
}

function stats(P=S.P){
  const rows=P.rows||[];
  const missing=FIELDS.filter(f=>f[2]&&(P[f[0]]==null||P[f[0]]==='')).length;
  const unassigned=rows.filter(r=>!r.cat).length;
  const sug=rows.filter(r=>r.cat&&r.cat!=='skip'&&(r.catSrc==='rule'||r.catSrc==='ai')).length;
  const unchecked=rows.filter(r=>!r.ok&&r.cat!=='skip').length,skip=rows.filter(r=>r.cat==='skip').length,flag=rows.filter(r=>r.flag&&!r.ok&&r.cat!=='skip').length;
  const inc=rows.filter(r=>r.cat&&r.cat!=='skip');
  const sI=inc.reduce((s,r)=>s+(+r.incl||0),0),sE=inc.reduce((s,r)=>s+(+r.excl||0),0);
  const dI=P.reportIncl?sI-P.reportIncl:null,dE=P.reportExcl?sE-P.reportExcl:null;
  const byCat={};inc.forEach(r=>byCat[r.cat]=(byCat[r.cat]||0)+(+r.incl||0));
  const recon=(dI!=null&&Math.abs(dI)>=1)||(dE!=null&&Math.abs(dE)>=1);
  return {missing,unassigned,sug,unchecked,skip,flag,sI,sE,dI,dE,n:rows.length,byCat,issues:missing+unassigned+flag+(recon?1:0)};
}

function bindSheet(){
  document.querySelectorAll('[data-eg]').forEach(b=>b.onclick=()=>{S.expGrouped=b.dataset.eg==='1';render()});
  const ok=$('#okPv');if(ok)ok.onchange=()=>{S.pvOk=ok.checked;render()};
  const tb=$('#tbT');if(tb)tb.onclick=()=>{S.tbOpen=!S.tbOpen;render()};
  const pi=$('#pvIss');if(pi)pi.onclick=()=>{S.pvIssues=!S.pvIssues;render()};
  const st=$('#scanT');if(st)st.onclick=()=>{S.scanOpen=!S.scanOpen;render()};
  const sx=$('#scanX');if(sx)sx.onclick=()=>{S.scanOpen=false;render()};
  document.querySelectorAll('[data-vp]').forEach(b=>b.onclick=()=>{S.pageSel=+b.dataset.vp;render()});
  document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{S.zoom=Math.max(.5,Math.min(3,S.zoom+(+b.dataset.z)*.25));render()});
  document.querySelectorAll('[data-scan]').forEach(b=>b.onclick=()=>{const i=S.pages.findIndex(p=>p.n==b.dataset.scan);if(i>=0){S.pageSel=i;S.scanOpen=true;render()}});
  const as=$('#accSug');if(as)as.onclick=()=>{const seen=new Set();S.P.rows.forEach(r=>{if(r.cat&&r.cat!=='skip'&&(r.catSrc==='rule'||r.catSrc==='ai')){r.catSrc='user';const k=gkey(r);if(!seen.has(k)){seen.add(k);rememberSupplier(r,r.cat)}}});S.pvOk=false;touch();render()};
  $('#addRow').onclick=()=>{S.P.rows.push({id:uid(),ord:S.P.rows.reduce((m,r)=>Math.max(m,r.ord||0),0)+1,sup:'',svc:'',date:'',excl:null,incl:null,rate:null,calc:'',page:null,note:'',ok:false,src:'manual',cat:''});S.expGrouped=false;S.pvIssues=false;touch();render();const t=document.querySelector('#pv tbody tr[data-ids] [data-lf=sup]');if(t){t.scrollIntoView({block:'center'});t.focus()}};
  document.querySelectorAll('#pv [data-okline]').forEach(b=>b.onclick=()=>{const ids=b.closest('tr').dataset.ids.split(',');const rs=S.P.rows.filter(r=>ids.includes(r.id));rs.forEach(r=>{r.ok=true;r.flag=false;r.vatOk=true;r.dupOk=true;if(r.catSrc==='rule'||r.catSrc==='ai')r.catSrc='user'});if(rs[0]&&rs[0].cat&&rs[0].cat!=='skip'){rememberSupplier(rs[0],rs[0].cat);propToast(propagateCat(rs[0],rs[0].cat,true),rs[0].sup)}S.pvOk=false;touch();rr()});
  document.querySelectorAll('#pv [data-delline]').forEach(b=>b.onclick=()=>{const id=b.closest('tr').dataset.ids;const i=S.P.rows.findIndex(r=>r.id===id);if(i<0)return;const r=S.P.rows.splice(i,1)[0];S.pvOk=false;touch();rr();toast('השורה נמחקה',[['ביטול',()=>{S.P.rows.splice(i,0,r);touch();render()}]])});
  document.querySelectorAll('#pv [data-pf]').forEach(i=>i.onchange=()=>{const k=i.dataset.pf;let v=i.value.trim();if(/area|index|devArea|devCost|bnm|report/.test(k))v=num(v);S.P[k]=v;if(S.P.src&&!/devArea|devCost|bnm|report/.test(k))S.P.src[k]=v===''||v==null?'':'manual';S.pvOk=false;touch();rr()});
  document.querySelectorAll('#pv tr[data-ids]').forEach(tr=>{const rows=tr.dataset.ids.split(',').map(id=>S.P.rows.find(r=>r.id===id)).filter(Boolean);
    tr.querySelectorAll('[data-lf]').forEach(i=>i.onchange=()=>{const k=i.dataset.lf,v=i.value;
      if(k==='sup'||k==='svc'||k==='date')rows.forEach(r=>r[k]=v.trim());
      else if(k==='note')rows.forEach((r,j)=>r.note=j?'':v.trim());

/* same supplier name -> same chapter in the whole project */
const supKey=x=>normName(x).replace(/\s+/g,'');
function propagateCat(src,cat,onlyOpen){
  const k=supKey(src.sup);if(!k)return 0;const prev=[];
  S.P.rows.forEach(r=>{if(r===src||supKey(r.sup)!==k||r.cat===cat)return;if(onlyOpen&&r.cat&&r.catSrc==='user')return;prev.push([r,r.cat,r.catSrc]);r.cat=cat;r.catSrc='user'});
  if(prev.length)S.lastProp=prev;return prev.length;
}
function propToast(n,sup){if(!n)return;toast(`הפרק עודכן גם ב-${n} שורות נוספות של "${sup}"`,[['ביטול',()=>{(S.lastProp||[]).forEach(([r,c,cs])=>{r.cat=c;r.catSrc=cs});S.lastProp=null;touch();render()}]])}

  let body='';
  if(t==='general')body=`<div class="card"><div class="grid">
    <div class="fld"><label><span>לוגו (מופיע בתפריט ובקובץ האקסל)</span></label><div class="row"><div class="brand" style="border:0;padding:0"><div class="logo" style="box-shadow:var(--sh)">${S.gen.logo?`<img src="${esc(S.gen.logo)}" alt="">`:IC.bld}</div></div><input type="file" id="logoF" accept="image/png,image/jpeg,image/svg+xml,image/webp" style="max-width:260px">${S.gen.logo?'<button class="sm" id="logoX">הסרה</button>':''}</div><p class="small muted">מעלים את קובץ הלוגו הרשמי של העירייה (PNG או SVG).</p></div>
    <div class="fld"><label><span>שם הגוף (מופיע בתפריט ובדשבורד)</span></label><input data-g="org" value="${esc(S.gen.org||'')}" placeholder="עיריית תל אביב-יפו · אגף מבני ציבור"></div>
    <div class="fld"><label><span>חברה מבצעת – ברירת מחדל לפרויקט חדש</span></label><input data-g="company" value="${esc(S.gen.company||'')}" placeholder="למשל: עזרה וביצרון"></div>
    <div class="fld"><label><span>עלות פיתוח למ"ר – הנחת עבודה (₪)</span></label><input data-g="devCost" inputmode="decimal" value="${esc(S.gen.devCost||'')}" placeholder="900"></div>
    <div class="fld"><label><span>ב.נ.מ. לניכוי (%)</span></label><input data-g="bnm" inputmode="decimal" value="${esc(S.gen.bnm||'')}" placeholder="15"></div>
   </div></div>`;
  if(t==='vat')body=`<div class="card" style="max-width:640px"><p class="muted" style="margin-top:0">המערכת בוחרת את שיעור המע"מ לפי תאריך החשבון הסופי. אפשר גם לקבוע שיעור לכל פרויקט ולכל שורה בנפרד.</p>
    <table><thead><tr><th>בתוקף מתאריך</th><th>שיעור %</th><th></th></tr></thead><tbody>${S.vat.map((v,i)=>`<tr><td><input type="date" data-vf="${i}" value="${esc(v.from)}"></td><td><input data-vr="${i}" inputmode="decimal" value="${esc(v.rate)}" style="width:90px"></td><td><button class="sm ghost" data-vd="${i}">✕</button></td></tr>`).join('')}</tbody></table>
    <div class="row" style="margin-top:12px"><button class="sm" id="va">+ שיעור חדש</button><span style="flex:1"></span><button class="pri" id="vs">שמירה</button></div></div>`;
  if(t==='sup'){const q=(S.supQ||'').trim();const list=Object.entries(S.sup).filter(([k,v])=>!q||(v.sup+' '+v.svc).includes(q)).sort((a,b)=>String(a[1].sup).localeCompare(String(b[1].sup),'he'));
    body=`<div class="card"><p class="muted" style="margin-top:0">שיוכים שהמערכת זוכרת לפי שם ספק (ולפעמים גם סוג שירות). הם מוחלים אוטומטית בכל פרויקט חדש.</p>
    <input id="supQ" placeholder="חיפוש ספק" value="${esc(S.supQ||'')}" style="max-width:320px;margin-bottom:10px">
    ${list.length?`<div class="tblwrap" style="max-height:520px;box-shadow:none;border:1px solid var(--line)"><table><thead><tr><th>ספק</th><th>סוג שירות</th><th>פרק</th><th></th></tr></thead><tbody>${list.map(([k,v])=>`<tr><td>${esc(v.sup)}</td><td>${esc(v.svc||'— כל השירותים —')}</td><td><select data-sk="${esc(k)}">${Object.entries(CATS).map(([c,l])=>`<option value="${c}" ${v.cat===c?'selected':''}>${l}</option>`).join('')}</select></td><td><button class="sm ghost" data-sdel="${esc(k)}">✕</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">המאגר ריק. הוא מתמלא כשמאשרים שיוכים בגיליון הבדיקה.</p>'}</div>`}
  if(t==='tpl')body=`<div class="card"><p class="muted" style="margin-top:0">פורמטים של דוחות שסימנתם בהם עמודות. בדוח חדש באותו פורמט הסימון מוחל אוטומטית.</p>
    ${(S.tpl||[]).length?`<table><thead><tr><th>כותרות העמודות</th><th>סימון</th><th>נשמר</th><th></th></tr></thead><tbody>${S.tpl.map((x,i)=>`<tr><td class="small">${esc((x.header||[]).filter(Boolean).join(' | ')||'—')}</td><td class="small">${esc(x.roles.map(r=>(ROLES.find(z=>z[0]===r)||['',''])[1]).filter(Boolean).join(' · '))}</td><td class="small muted">${x.at?fmtDT(new Date(x.at)):''}</td><td><button class="sm ghost" data-tdel="${i}">✕</button></td></tr>`).join('')}</tbody></table>`:'<p class="muted">עדיין לא נשמרו פורמטים.</p>'}</div>`;
  if(t==='backup')body=`<div class="dgrid"><div class="card"><h3>הורדת גיבוי מלא</h3><p class="muted">קובץ אחד עם כל הפרויקטים, מאגר הספקים, הפורמטים וההגדרות. מומלץ לגבות פעם בשבוע ולשמור בתיקייה משותפת.</p>
    <p class="small">${S.gen.lastBackup?'גיבוי אחרון: '+fmtDT(new Date(S.gen.lastBackup)):'עדיין לא בוצע גיבוי.'}</p><button class="pri" id="bkAll">הורדת גיבוי (${S.projects.length} פרויקטים)</button></div>
   <div class="card"><h3>שחזור מגיבוי</h3><p class="muted">טוענים קובץ גיבוי. פרויקטים עם אותו מזהה יוחלפו בגרסה שבגיבוי, ושאר הפרויקטים יישארו.</p><input type="file" id="rsF" accept="application/json,.json"></div></div>`;
  return `<div class="head"><div><h1>הגדרות וגיבוי</h1><p>הגדרות כלליות, שיעורי מע"מ, המאגרים שהמערכת לומדת, וגיבוי הנתונים.</p></div></div>
  <div class="stabs">${tabs.map(([k,l])=>`<button data-st="${k}" class="${t===k?'on':''}">${l}</button>`).join('')}</div>${body}`;
}
function bindSettings(){
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{S.stab=b.dataset.st;render()});
  document.querySelectorAll('[data-g]').forEach(i=>i.onchange=()=>{const k=i.dataset.g;S.gen[k]=/devCost|bnm/.test(k)?num(i.value):i.value.trim();saveGen();render();toast('נשמר')});
  const lf=$('#logoF');if(lf)lf.onchange=async()=>{const f=lf.files[0];if(!f)return;const url=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)});
    const img=new Image();img.onload=async()=>{const sc=Math.min(1,240/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc)||240;c.height=Math.round(img.height*sc)||240;c.getContext('2d').drawImage(img,0,0,c.width,c.height);S.gen.logo=c.toDataURL('image/png');await saveGen();render();toast('הלוגו נשמר')};img.src=url};
  const lx=$('#logoX');if(lx)lx.onclick=async()=>{delete S.gen.logo;await saveGen();render()};
  document.querySelectorAll('[data-vd]').forEach(b=>b.onclick=()=>{S.vat.splice(+b.dataset.vd,1);render()});
  const va=$('#va');if(va)va.onclick=()=>{S.vat.push({from:new Date().toISOString().slice(0,10),rate:18});render()};
  const vs=$('#vs');if(vs)vs.onclick=async()=>{S.vat=S.vat.map((v,i)=>({from:document.querySelector(`[data-vf="${i}"]`).value,rate:num(document.querySelector(`[data-vr="${i}"]`).value)})).filter(v=>v.from&&v.rate!=null).sort((a,b)=>a.from<b.from?-1:1);await saveVat();render();toast('שיעורי המע"מ נשמרו')};
  const sq=$('#supQ');if(sq)sq.oninput=()=>{S.supQ=sq.value;const p=sq.selectionStart;render();const n=$('#supQ');n.focus();n.setSelectionRange(p,p)};
  document.querySelectorAll('[data-sk]').forEach(s=>s.onchange=async()=>{const k=s.dataset.sk;S.sup[k].cat=s.value;if(S.db){try{await S.db.doc('suppliers/'+k).set(S.sup[k])}catch(e){}}else LS.set('sup',S.sup);toast('נשמר')});
  document.querySelectorAll('[data-sdel]').forEach(b=>b.onclick=async()=>{const k=b.dataset.sdel;delete S.sup[k];if(S.db){try{await S.db.doc('suppliers/'+k).delete()}catch(e){}}else LS.set('sup',S.sup);render()});
  document.querySelectorAll('[data-tdel]').forEach(b=>b.onclick=async()=>{const x=S.tpl.splice(+b.dataset.tdel,1)[0];if(S.db){try{await S.db.doc('templates/'+hash(x.sig)).delete()}catch(e){}}else LS.set('tpl',S.tpl);render()});
  const bk=$('#bkAll');if(bk)bk.onclick=async()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');
    downloadJSON({app:'final-accounts',v:1,at:Date.now(),projects:S.projects,suppliers:S.sup,templates:S.tpl||[],settings:{vat:S.vat,general:S.gen}},`גיבוי חשבונות סופיים - ${p(d.getDate())}-${p(d.getMonth()+1)}-${d.getFullYear()}.json`);
    S.gen.lastBackup=Date.now();await saveGen();render()};
  const rs=$('#rsF');if(rs)rs.onchange=async()=>{const f=rs.files[0];if(!f)return;let B;try{B=JSON.parse(await f.text());if(B.app!=='final-accounts')throw 0}catch(e){toast('הקובץ אינו גיבוי של המערכת');return}
    const np=(B.projects||[]).length,ns=Object.keys(B.suppliers||{}).length,nt=(B.templates||[]).length;
    dialog(`<h3>שחזור מגיבוי</h3><p>בקובץ: <b>${np}</b> פרויקטים, <b>${ns}</b> שיוכי ספקים, <b>${nt}</b> פורמטים${B.settings?' והגדרות':''}.</p><p class="muted small">פרויקטים עם אותו מזהה יוחלפו. גיבוי מ-${B.at?fmtDT(new Date(B.at)):'—'}.</p><div class="row"><button class="pri" data-ok>שחזור</button><button data-x>ביטול</button></div>`,el=>{
      el.querySelector('[data-ok]').onclick=async()=>{closeDlg();toast('משחזר…');
        for(const p of B.projects||[]){if(!p||!p.id)continue;if(S.db){try{await S.db.doc('projects/'+p.id).set(p)}catch(e){}}const i=S.projects.findIndex(x=>x.id===p.id);if(i>=0)S.projects[i]=p;else S.projects.push(p)}
        for(const [k,v] of Object.entries(B.suppliers||{})){S.sup[k]=v;if(S.db){try{await S.db.doc('suppliers/'+k).set(v)}catch(e){}}}
        for(const t of B.templates||[]){S.tpl=(S.tpl||[]).filter(x=>x.sig!==t.sig);S.tpl.push(t);if(S.db){try{await S.db.doc('templates/'+hash(t.sig)).set(t)}catch(e){}}}
        if(B.settings&&B.settings.vat){S.vat=B.settings.vat;await saveVat()}
        if(!S.db){LS.set('projects',S.projects);LS.set('sup',S.sup);LS.set('tpl',S.tpl)}
        render();toast(`שוחזרו ${np} פרויקטים`)}})};
}
/* ---------- dialogs ---------- */
function dialog(html,bind){$('#layer').innerHTML=`<div class="dlg" role="dialog" aria-modal="true"><div>${html}</div></div>`;const el=$('#layer .dlg>div');el.querySelectorAll('[data-x]').forEach(b=>b.onclick=closeDlg);$('#layer .dlg').onclick=e=>{if(e.target.classList.contains('dlg'))closeDlg()};bind&&bind(el)}
function closeDlg(){$('#layer').innerHTML=''}
let toastT;function toast(t,acts){const el=document.createElement('div');el.className='toast';el.textContent=t;(acts||[]).forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{f();el.remove()};el.appendChild(b)});document.querySelectorAll('.toast').forEach(x=>x.remove());document.body.appendChild(el);clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),6000)}
function vatDialog(){
  const rowsH=()=>S.vat.map((v,i)=>`<tr><td><input type="date" data-vf="${i}" value="${esc(v.from)}"></td><td><input data-vr="${i}" inputmode="decimal" value="${esc(v.rate)}" style="width:80px"></td><td><button class="sm ghost" data-vd="${i}">✕</button></td></tr>`).join('');
  dialog(`<h3>שיעורי מע"מ לפי תאריך</h3><p class="muted small">המערכת בוחרת את השיעור לפי תאריך החשבון הסופי. אפשר לשנות שיעור לכל שורה בנפרד בטבלה.</p>
   <table><thead><tr><th>בתוקף מתאריך</th><th>שיעור %</th><th></th></tr></thead><tbody id="vt">${rowsH()}</tbody></table>
   <div class="row" style="margin-top:12px"><button class="sm" id="va">+ שיעור חדש</button><span style="flex:1"></span><button class="pri" id="vs">שמירה</button><button data-x>ביטול</button></div>`,el=>{
    const bindT=()=>{el.querySelectorAll('[data-vd]').forEach(b=>b.onclick=()=>{S.vat.splice(+b.dataset.vd,1);el.querySelector('#vt').innerHTML=rowsH();bindT()})};bindT();
    el.querySelector('#va').onclick=()=>{S.vat.push({from:new Date().toISOString().slice(0,10),rate:18});el.querySelector('#vt').innerHTML=rowsH();bindT()};
    el.querySelector('#vs').onclick=async()=>{S.vat=S.vat.map((v,i)=>({from:el.querySelector(`[data-vf="${i}"]`).value,rate:num(el.querySelector(`[data-vr="${i}"]`).value)})).filter(v=>v.from&&v.rate!=null).sort((a,b)=>a.from<b.from?-1:1);await saveVat();closeDlg();if(S.P){S.P.rows.forEach(r=>{if(r.calc&&r.rate==null)fixVat(r)});touch()}render()};
  });
}
window.addEventListener('beforeunload',e=>{if(dirty){save();e.preventDefault()}});
/* ---------- start ---------- */
S.view='boot';render();
S.dl={save:async({filename,data})=>{const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return {status:'saved'}}};
(async()=>{
  for(let i=0;!window.FA_BACKEND&&i<100;i++)await new Promise(r=>setTimeout(r,50));
  let BE;try{BE=(await window.FA_BACKEND)||{mode:'local'}}catch(e){console.error(e);BE={mode:'local'};toast('החיבור ל-Firebase נכשל – עובדים במצב מקומי')}
  if(BE.mode==='firebase'){
    S.sample=BE.sample;S.db=BE.db;S.view='dash';await loadAll();render();
  }else{S.view='dash';await loadAll();render()}
})();
}
</script>
</body>
</html>
